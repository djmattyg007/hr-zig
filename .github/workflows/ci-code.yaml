name: "Code checks"

on:
  push:
    branches:
      - "**"
  pull_request: ~

jobs:
  test-zig:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        zig-version:
          - "0.15.1"
          - "0.15.2"
          - "latest"
    runs-on: "${{ matrix.os }}"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8" # v6.0.1

      - name: "Install Zig"
        uses: "mlugg/setup-zig@e7d1537c378b83b8049f65dda471d87a2f7b2df2" # v2.2.0
        with:
          version: "${{ matrix.zig-version }}"
          cache-key: "${{ matrix.zig-version }}"

      - name: "Build"
        run: "zig build"

      - name: "Lint"
        run: "zig fmt --check ."

  test-goreleaser:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8" # v6.0.1

      - name: "Generate GoReleaser config"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.21.0@sha256:011e4286c47cbac9193a16d5986ddd65279e538742c4830b0baf2cf072f0fb41"
        with:
          args: "jsonnet --output-file .goreleaser.yaml dev/goreleaser.jsonnet"

      - name: "GoReleaser check"
        uses: "goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a" # v6.4.0
        with:
          args: "check --verbose"

      - name: "Install Zig"
        uses: "mlugg/setup-zig@e7d1537c378b83b8049f65dda471d87a2f7b2df2" # v2.2.0
        with:
          version: "0.15.2"
          cache-key: "0.15.2"

      - name: "GoReleaser test build"
        uses: "goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a" # v6.4.0
        with:
          args: "build --verbose --snapshot"
