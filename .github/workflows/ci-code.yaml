name: "Code checks"

on:
  push:
    branches:
      - "**"
  pull_request: ~

jobs:
  test-zig:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        zig-version:
          - "0.15.1"
          - "0.15.2"
          - "latest"
    runs-on: "${{ matrix.os }}"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3" # v6.0.0

      - name: "Install Zig"
        uses: "mlugg/setup-zig@fa65c4058643678a4e4a9a60513944a7d8d35440" # v2.1.0
        with:
          version: "${{ matrix.zig-version }}"
          cache-key: "${{ matrix.zig-version }}"

      - name: "Build"
        run: "zig build"

      - name: "Lint"
        run: "zig fmt --check ."

  test-goreleaser:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3" # v6.0.0

      - name: "Generate GoReleaser config"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.21.0@sha256:4c38928922c5d532bfbc0fe9de1b06a013988f4495f35604a30ed4e96b5c51e5"
        with:
          args: "jsonnet --output-file .goreleaser.yaml dev/goreleaser.jsonnet"

      - name: "GoReleaser check"
        uses: "goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a" # v6.4.0
        with:
          args: "check"

      - name: "Install Zig"
        uses: "mlugg/setup-zig@fa65c4058643678a4e4a9a60513944a7d8d35440" # v2.1.0
        with:
          version: "0.15.2"
          cache-key: "0.15.2"

      - name: "GoReleaser test build"
        uses: "goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a" # v6.4.0
        with:
          args: "build --snapshot"
