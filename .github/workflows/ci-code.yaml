name: "Code checks"

on:
  push:
    branches:
      - "**"
  pull_request: ~

jobs:
  test-zig:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        zig-version:
          - "0.15.1"
          - "0.15.2"
          - "latest"
    runs-on: "${{ matrix.os }}"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Install Zig"
        uses: "mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29" # v2.2.1
        with:
          version: "${{ matrix.zig-version }}"
          cache-key: "${{ matrix.zig-version }}"

      - name: "Build"
        run: "zig build"

      - name: "Lint"
        run: "zig fmt --check ."

  test-goreleaser:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Generate GoReleaser config"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.22.0@sha256:9887678e3a436526e8a17e3cbcbe53f457b447554d15a51157fc7b3eaed87a88"
        with:
          args: "jsonnet --output-file .goreleaser.yaml dev/goreleaser.jsonnet"

      - name: "GoReleaser check"
        uses: "goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de" # v7.3.0
        with:
          args: "check --verbose"

      - name: "Install Zig"
        uses: "mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29" # v2.2.1
        with:
          version: "0.15.2"
          cache-key: "0.15.2"

      - name: "GoReleaser test build"
        uses: "goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de" # v7.3.0
        with:
          args: "build --verbose --snapshot"
