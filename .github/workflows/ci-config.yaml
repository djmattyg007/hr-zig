name: "Config checks"

on:
  push:
    branches:
      - "**"
  pull_request: ~

jobs:
  test-config:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Lint config"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.22.0@sha256:9887678e3a436526e8a17e3cbcbe53f457b447554d15a51157fc7b3eaed87a88"
        with:
          args: "jsonnet-lint dev/goreleaser.jsonnet"

      - name: "Check config formatting"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.22.0@sha256:9887678e3a436526e8a17e3cbcbe53f457b447554d15a51157fc7b3eaed87a88"
        with:
          args: "jsonnetfmt --string-style d --test dev/goreleaser.jsonnet"

      - name: "Run actionlint"
        uses: "reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440" # v1.81.1
        with:
          fail_level: "warning"

      - name: "Run gitleaks"
        uses: "reviewdog/action-gitleaks@2b7b5685e3e3eecddab5d30cfa04f18123031421" # v1.8.0
        with:
          fail_level: "warning"
