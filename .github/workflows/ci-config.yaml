name: "Config checks"

on:
  push:
    branches:
      - "**"
  pull_request: ~

jobs:
  test-config:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Lint config"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.22.0@sha256:03902b3c757edb26fe0fcb1464db9bb119305e38ac1e685c94c991fddf51a62d"
        with:
          args: "jsonnet-lint dev/goreleaser.jsonnet"

      - name: "Check config formatting"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.22.0@sha256:03902b3c757edb26fe0fcb1464db9bb119305e38ac1e685c94c991fddf51a62d"
        with:
          args: "jsonnetfmt --string-style d --test dev/goreleaser.jsonnet"

      - name: "Run actionlint"
        uses: "reviewdog/action-actionlint@13465d022aa41c282f730be17574b5ce692d0186" # v1.78.1
        with:
          fail_level: "warning"

      - name: "Run gitleaks"
        uses: "reviewdog/action-gitleaks@2b7b5685e3e3eecddab5d30cfa04f18123031421" # v1.8.0
        with:
          fail_level: "warning"
