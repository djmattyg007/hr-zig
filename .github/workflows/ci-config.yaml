name: "Config checks"

on:
  push:
    branches:
      - "**"
  pull_request: ~

jobs:
  test-config:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2

      - name: "Lint config"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.21.0@sha256:0b5c62a44f9048d92bbb7d5385289cf75b56724575d13a13c351f433a1bc5dbf"
        with:
          args: "jsonnet-lint dev/goreleaser.jsonnet"

      - name: "Check config formatting"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.21.0@sha256:0b5c62a44f9048d92bbb7d5385289cf75b56724575d13a13c351f433a1bc5dbf"
        with:
          args: "jsonnetfmt --string-style d --test dev/goreleaser.jsonnet"

      - name: "Run actionlint"
        uses: "reviewdog/action-actionlint@83e4ed25b168066ad8f62f5afbb29ebd8641d982" # v1.69.1
        with:
          fail_level: "warning"

      - name: "Run gitleaks"
        uses: "reviewdog/action-gitleaks@2b7b5685e3e3eecddab5d30cfa04f18123031421" # v1.8.0
        with:
          fail_level: "warning"
