name: "Config checks"

on:
  push:
    branches:
      - "**"
  pull_request: ~

jobs:
  test-config:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Lint config"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.22.0@sha256:8e4db6d861ee3b39d17d1b1ce53173837af13023a9331644539358a398ce233b"
        with:
          args: "jsonnet-lint dev/goreleaser.jsonnet"

      - name: "Check config formatting"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.22.0@sha256:8e4db6d861ee3b39d17d1b1ce53173837af13023a9331644539358a398ce233b"
        with:
          args: "jsonnetfmt --string-style d --test dev/goreleaser.jsonnet"

      - name: "Run actionlint"
        uses: "reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e" # v1.74.0
        with:
          fail_level: "warning"

      - name: "Run gitleaks"
        uses: "reviewdog/action-gitleaks@2b7b5685e3e3eecddab5d30cfa04f18123031421" # v1.8.0
        with:
          fail_level: "warning"
