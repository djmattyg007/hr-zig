name: "Release"

on:
  push:
    tags:
      - "v1*"

jobs:
  release:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          fetch-depth: 0

      - name: "Install Zig"
        uses: "mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29" # v2.2.1
        with:
          version: "0.15.2"
          cache-key: "0.15.2"

      # - name: "Install Syft"
      #   id: "install-syft"
      #   uses: "anchore/sbom-action/download-syft@fbfd9c6c189226748411491745178e0c2017392d" # v0.20.10

      - name: "Import GPG key"
        id: "import-gpg"
        uses: "crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd" # v7.0.0
        with:
          gpg_private_key: "${{ secrets.GPG_PRIVATE_KEY }}"
          passphrase: "${{ secrets.GPG_PASSPHRASE }}"

      - name: "Generate GoReleaser config"
        uses: "docker://ghcr.io/djmattyg007/jsonnet:0.22.0@sha256:b45f05013a14c057c886c962d44427bb944e77f661b9a33b9f0a13666f4a37ee"
        with:
          args: 'jsonnet --output-file .goreleaser.yaml dev/goreleaser.jsonnet'

      - name: "Generate release notes"
        run: |
          perl -s -0777 -p -e 's/.*(## $tag - .*?)(## .*|$)/$1/s' -- -tag="${{ github.ref_name }}" CHANGELOG.md | tail -n+3 | tee release-notes.md

      - name: "Run GoReleaser"
        uses: "goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29" # v7.0.0
        with:
          args: "release --verbose --clean --release-notes=release-notes.md"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GPG_FINGERPRINT: "${{ steps.import-gpg.outputs.fingerprint }}"
          AUR_SSH_PRIVATE_KEY: "${{ secrets.AUR_SSH_PRIVATE_KEY }}"
